[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "board-identify"
version = "0.1.0"
description = "Identify serial-connected microcontroller boards"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "TANAKA Masayuki" }]
dependencies = ["esptool>=4,<6"]

[project.scripts]
board-identify = "board_identify.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["esptool.*", "esptool"]
ignore_missing_imports = true

[tool.setuptools.package-data]
board_identify = ["py.typed"]
